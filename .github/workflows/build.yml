name: Build Fleasion (FastFlags)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install cryptography zstandard certifi pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

  build:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e . pyinstaller
      - name: Build exe (requests admin via UAC manifest)
        shell: pwsh
        run: >
          pyinstaller --onefile --noconsole --uac-admin
          --name Fleasion-FFlags
          --icon src/fleasion/fleasionlogoHR.ico
          --add-data "src/fleasion/fleasionlogoHR.ico;fleasion"
          --paths src --collect-submodules fleasion
          launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fleasion-FFlags-Windows
          path: dist/Fleasion-FFlags.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fleasion-FFlags-Windows
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/Fleasion-FFlags.exe
          generate_release_notes: true
